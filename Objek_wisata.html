<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Makanan Khas Sulawesi Selatan</title>
    <link rel="stylesheet" href="assets/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        /* Gaya umum untuk body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 0;
        }

        /* Gaya untuk container */
        .container {
            display: flex;
            flex-basis: wrap;
            justify-content: center;
        }

        /* Gaya untuk sidebar */
        .sidebar {
            flex: 20%;
            background-color: #444;
            height: 100vh;
        }

        .sidebar nav ul {
            list-style-type: none;
            padding: 0;
        }

        .sidebar nav ul li {
            border-bottom: 1px dotted #5e5d5d;
        }

        .sidebar nav ul li a {
            text-decoration: none;
            color: white;
            display: block;
            padding: 20px 20px;
            background-color: #444;
            border-radius: 4px;
            text-align: center;
        }

        .sidebar nav ul li a:hover {
            background-color: #555;
        }

        /* Gaya untuk konten utama */
        section.content {
            flex: 80%;
            padding: 20px;
            height: 100vh;
            overflow: scroll;
        }

        /* Header */
        header {
            background-color: #333;
            color: #fff;
            text-align: left;
            padding: 15px 20px;
        }

        /* Tombol tambah */
        .add-button {
            margin-bottom: 20px;
            text-align: left;
        }

        .add-button button {
            background-color: #28a745;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .add-button button:hover {
            background-color: #218838;
        }

        /* Gaya untuk tabel */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background-color: #fff;
        }

        table th,
        table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        table th {
            background-color: #333;
            color: white;
        }

        table img {
            border-radius: 4px;
        }

        /* Tombol aksi */
        .edit-btn,
        .delete-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit-btn {
            background-color: #007bff;
            color: white;
        }

        .edit-btn:hover {
            background-color: #0056b3;
        }

        .delete-btn {
            background-color: #dc3545;
            color: white;
        }

        .delete-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>
  

       
        <section class="content">
            <h1 class="text-center text-success my-4">Daftar Objek Wisata</h1>
            <div class="alert alert-success text-center m-3">Selamat datang di halaman daftar makanan khas Sulawesi Selatan</div>

            <table id="food-table">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama Objek Wisata</th>
                        <th>Gambar</th>
                        <th>Deskripsi</th>
                        <th>Aksi</th>
                    </tr>
                </thead> 
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Malnnying</td>
                        <td><img src="malanyying.jpg" alt="Malannying" width="100"></td>
                        <td>Ini adalah malnyying.</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Hapus</button>
                        </td>
                    </tr>
                    <tr>
                        <td>2</td>
                        <td>Pantai losari</td>
                        <td><img src="pantailosari.jpg" alt="Pantai Losari" width="100"></td>
                        <td>Makassart.</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Hapus</button>
                        </td>
                    </tr>
                    <tr> 
                        <td>3</td>
                        <td>Latimojong</td>
                        <td><img src="latimojong.jpg" alt="Latimojong" width="100"></td>
                        <td>Gunung engrekang.</td>
                        <td>
                            <button class="edit-btn">Edit</button>
                            <button class="delete-btn">Hapus</button>
                        </td>
                    </tr>
                </tbody>
            </table>
                 
            <div class="text-end">
                <button class="btn btn-success btn-lg">Tambah</button>
            </div>


        </section>
    </div>
</body>

</html>
